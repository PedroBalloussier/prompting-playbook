<!DOCTYPE html>
<html lang="en" data-palette="emerald" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompting Playbook</title>
<meta name="description" content="An interactive, offline learning tool for writing better prompts for workplace AI assistants. All examples are simulated.">
<style>
/* ============================================================
   PROMPTING PLAYBOOK — design tokens
   Palette x Mode: emerald|sunset  x  dark|light
   Token names mirror the Apex app so a palette can be swapped
   by replacing the values in this block only.
   ============================================================ */
:root{
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
  --ff: "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --ff-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  --t-fast:140ms; --t-med:260ms; --t-slow:420ms;
  --ease: cubic-bezier(.22,.61,.36,1);
  --maxw:1240px;
}

/* ---------- EMERALD / DARK (default) ---------- */
html[data-palette="emerald"][data-mode="dark"]{
  --bg:#0B1310; --bg2:#0F1A16; --bg3:#13231D;
  --surface:rgba(255,255,255,.045); --surface2:rgba(255,255,255,.075);
  --surface-solid:#13201B;
  --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.16);
  --text:#E8F3EE; --text2:#C3D6CD; --muted:#8CA59A;
  --primary:#10B981; --primary-ink:#04140E; --primary-soft:rgba(16,185,129,.14);
  --accent:#34D399; --highlight:#FBBF24; --supporting:#60A5FA; --danger:#F87171;
  --shadow:0 18px 44px -24px rgba(0,0,0,.85);
  --shadow-soft:0 8px 24px -16px rgba(0,0,0,.7);
  --glow:rgba(16,185,129,.30);
  --node:rgba(52,211,153,.55); --link:rgba(52,211,153,.13);
  --mark-a:rgba(16,185,129,.22); --mark-b:rgba(96,165,250,.22);
  --mark-c:rgba(251,191,36,.22); --mark-d:rgba(167,139,250,.22);
  --mark-a-line:#10B981; --mark-b-line:#60A5FA; --mark-c-line:#FBBF24; --mark-d-line:#A78BFA;
  --bubble-user:rgba(255,255,255,.06); --bubble-ai:rgba(16,185,129,.07);
}
/* ---------- EMERALD / LIGHT ---------- */
html[data-palette="emerald"][data-mode="light"]{
  --bg:#F2F7F4; --bg2:#FFFFFF; --bg3:#E8F1EC;
  --surface:rgba(255,255,255,.78); --surface2:rgba(255,255,255,.95);
  --surface-solid:#FFFFFF;
  --border:rgba(13,43,32,.11); --border2:rgba(13,43,32,.2);
  --text:#0D1B16; --text2:#2C4138; --muted:#4E6258;
  --primary:#0B7A55; --primary-ink:#FFFFFF; --primary-soft:rgba(11,122,85,.12);
  --accent:#096A4A; --highlight:#8A4309; --supporting:#1D4ED8; --danger:#B91C1C;
  --shadow:0 16px 40px -26px rgba(13,43,32,.38);
  --shadow-soft:0 8px 20px -16px rgba(13,43,32,.3);
  --glow:rgba(14,159,110,.2);
  --node:rgba(14,159,110,.5); --link:rgba(14,159,110,.12);
  --mark-a:rgba(14,159,110,.18); --mark-b:rgba(29,78,216,.14);
  --mark-c:rgba(180,83,9,.16); --mark-d:rgba(109,40,217,.14);
  --mark-a-line:#0B7A55; --mark-b-line:#1D4ED8; --mark-c-line:#8A4309; --mark-d-line:#6D28D9;
  --bubble-user:rgba(13,43,32,.045); --bubble-ai:rgba(14,159,110,.07);
}
/* ---------- SUNSET / DARK ---------- */
html[data-palette="sunset"][data-mode="dark"]{
  --bg:#17110E; --bg2:#1F1712; --bg3:#271C16;
  --surface:rgba(255,255,255,.05); --surface2:rgba(255,255,255,.08);
  --surface-solid:#241A15;
  --border:rgba(255,255,255,.10); --border2:rgba(255,255,255,.18);
  --text:#F7EDE4; --text2:#E0CDBE; --muted:#B49C8B;
  --primary:#E2622C; --primary-ink:#1A0D06; --primary-soft:rgba(226,98,44,.16);
  --accent:#F0745A; --highlight:#E8A33D; --supporting:#C7A8DA; --danger:#F26D6D;
  --shadow:0 18px 44px -24px rgba(0,0,0,.85);
  --shadow-soft:0 8px 24px -16px rgba(0,0,0,.7);
  --glow:rgba(226,98,44,.32);
  --node:rgba(240,116,90,.55); --link:rgba(240,116,90,.14);
  --mark-a:rgba(226,98,44,.24); --mark-b:rgba(199,168,218,.24);
  --mark-c:rgba(232,163,61,.24); --mark-d:rgba(240,116,90,.24);
  --mark-a-line:#E2622C; --mark-b-line:#C7A8DA; --mark-c-line:#E8A33D; --mark-d-line:#F0745A;
  --bubble-user:rgba(255,255,255,.06); --bubble-ai:rgba(226,98,44,.08);
}
/* ---------- SUNSET / LIGHT ---------- */
html[data-palette="sunset"][data-mode="light"]{
  --bg:#FCF4EC; --bg2:#FFFFFF; --bg3:#F6E9DC;
  --surface:rgba(255,255,255,.8); --surface2:rgba(255,255,255,.95);
  --surface-solid:#FFFFFF;
  --border:rgba(60,32,18,.12); --border2:rgba(60,32,18,.22);
  --text:#251813; --text2:#4A3326; --muted:#6B5343;
  --primary:#B0441A; --primary-ink:#FFFFFF; --primary-soft:rgba(176,68,26,.12);
  --accent:#9E3A22; --highlight:#845212; --supporting:#6D28D9; --danger:#B91C1C;
  --shadow:0 16px 40px -26px rgba(60,32,18,.35);
  --shadow-soft:0 8px 20px -16px rgba(60,32,18,.28);
  --glow:rgba(201,82,31,.2);
  --node:rgba(201,82,31,.5); --link:rgba(201,82,31,.12);
  --mark-a:rgba(201,82,31,.18); --mark-b:rgba(109,40,217,.14);
  --mark-c:rgba(154,98,18,.18); --mark-d:rgba(184,69,42,.16);
  --mark-a-line:#B0441A; --mark-b-line:#6D28D9; --mark-c-line:#845212; --mark-d-line:#9E3A22;
  --bubble-user:rgba(60,32,18,.05); --bubble-ai:rgba(201,82,31,.07);
}

/* ============================================================
   Base
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--ff); background:var(--bg); color:var(--text);
  line-height:1.6; font-size:16px; letter-spacing:.005em;
  min-height:100vh; overflow-x:hidden;
  transition:background var(--t-med) var(--ease), color var(--t-med) var(--ease);
}
body::before{
  content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(60% 50% at 12% 0%, var(--glow), transparent 62%),
    radial-gradient(48% 46% at 92% 8%, var(--primary-soft), transparent 60%),
    linear-gradient(180deg, var(--bg2) 0%, var(--bg) 46%, var(--bg) 100%);
}
#bgCanvas{position:fixed; inset:0; z-index:-1; width:100%; height:100%; pointer-events:none}
h1,h2,h3,h4{margin:0 0 var(--sp-3); line-height:1.2; letter-spacing:-.018em; font-weight:650}
p{margin:0 0 var(--sp-3)}
a{color:var(--primary)}
button,select,input,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--primary); outline-offset:3px; border-radius:6px}
.sr-only{position:absolute!important; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
.skip{position:absolute; left:-999px; top:8px; z-index:100; background:var(--primary); color:var(--primary-ink); padding:10px 16px; border-radius:var(--r-sm); font-weight:600}
.skip:focus{left:12px}

/* ============================================================
   Shell / header
   ============================================================ */
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 var(--sp-5)}
.topbar{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter:blur(14px) saturate(130%);
  -webkit-backdrop-filter:blur(14px) saturate(130%);
  border-bottom:1px solid var(--border);
}
.topbar-in{display:flex; align-items:center; gap:var(--sp-4); min-height:62px; padding:var(--sp-2) var(--sp-5); max-width:var(--maxw); margin:0 auto}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.mark{
  width:32px; height:32px; flex:0 0 32px; border-radius:9px;
  background:linear-gradient(145deg, var(--primary), var(--accent));
  display:grid; place-items:center; box-shadow:0 6px 18px -10px var(--glow);
}
.mark svg{width:18px; height:18px; display:block}
.brandtxt{display:flex; flex-direction:column; min-width:0}
.brandtxt b{font-size:15px; font-weight:650; letter-spacing:-.01em; white-space:nowrap}
.brandtxt span{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tb-actions{margin-left:auto; display:flex; align-items:center; gap:var(--sp-2)}
.ctl{
  height:36px; display:inline-flex; align-items:center; gap:7px;
  padding:0 11px; border-radius:var(--r-sm);
  background:var(--surface); border:1px solid var(--border);
  color:var(--text2); cursor:pointer;
  font-size:13.5px; font-weight:550;
  transition:background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.ctl:hover{background:var(--surface2); border-color:var(--border2); color:var(--text)}
.ctl:active{transform:translateY(1px)}
.ctl svg{width:15px; height:15px; flex:0 0 15px}
select.ctl{
  -webkit-appearance:none; appearance:none; padding-right:28px; cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) 16px, calc(100% - 10px) 16px;
  background-size:5px 5px,5px 5px; background-repeat:no-repeat;
}
select.ctl option{background:var(--surface-solid); color:var(--text)}
.icon-only{width:36px; padding:0; justify-content:center}

/* ============================================================
   Hero + progress
   ============================================================ */
.hero{padding:var(--sp-7) 0 var(--sp-5); text-align:left; max-width:760px}
.eyebrow{
  display:inline-flex; align-items:center; gap:7px; margin-bottom:var(--sp-4);
  font-size:11.5px; font-weight:650; letter-spacing:.09em; text-transform:uppercase;
  color:var(--primary); background:var(--primary-soft);
  border:1px solid color-mix(in srgb, var(--primary) 26%, transparent);
  padding:5px 11px; border-radius:999px;
}
.eyebrow i{width:6px; height:6px; border-radius:50%; background:var(--primary); display:block}
.hero h1{font-size:clamp(28px,5.1vw,47px); font-weight:700; letter-spacing:-.03em; margin-bottom:var(--sp-4)}
.hero h1 em{font-style:normal; color:var(--primary)}
.hero .lead{font-size:clamp(15px,1.7vw,17.5px); color:var(--text2); max-width:62ch; margin-bottom:var(--sp-5)}
.progress-card{
  display:flex; align-items:center; gap:var(--sp-4); flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  padding:var(--sp-3) var(--sp-4); backdrop-filter:blur(8px);
  box-shadow:var(--shadow-soft);
}
.progress-meta{font-size:13.5px; font-weight:600; white-space:nowrap}
.progress-meta b{color:var(--primary); font-weight:700}
.bar{flex:1 1 180px; height:7px; min-width:140px; border-radius:999px; background:var(--bg3); overflow:hidden; border:1px solid var(--border)}
.bar>i{display:block; height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,var(--primary),var(--accent)); transition:width var(--t-slow) var(--ease)}
.progress-note{font-size:12.5px; color:var(--muted)}

/* ============================================================
   Technique cards
   ============================================================ */
.section-head{display:flex; align-items:baseline; gap:var(--sp-3); flex-wrap:wrap; margin:var(--sp-7) 0 var(--sp-4)}
.section-head h2{font-size:clamp(19px,2.3vw,23px); margin:0}
.section-head p{margin:0; font-size:13.5px; color:var(--muted)}
.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:var(--sp-4)}
.card{
  position:relative; text-align:left; cursor:pointer; overflow:hidden;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:var(--sp-5) var(--sp-4) var(--sp-4);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:var(--shadow-soft);
  transition:transform var(--t-med) var(--ease), border-color var(--t-med) var(--ease), background var(--t-med) var(--ease), box-shadow var(--t-med) var(--ease);
}
.card::after{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:radial-gradient(120% 90% at 50% -20%, var(--primary-soft), transparent 58%);
  opacity:0; transition:opacity var(--t-med) var(--ease);
}
.card:hover,.card:focus-visible{transform:translateY(-3px); border-color:color-mix(in srgb, var(--primary) 40%, var(--border)); box-shadow:var(--shadow)}
.card:hover::after,.card:focus-visible::after{opacity:1}
.card-top{display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); margin-bottom:var(--sp-3)}
.num{
  font-family:var(--ff-mono); font-size:12px; font-weight:600; letter-spacing:.04em;
  width:28px; height:28px; border-radius:8px; display:grid; place-items:center;
  color:var(--primary); background:var(--primary-soft);
  border:1px solid color-mix(in srgb, var(--primary) 28%, transparent);
}
.state{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; letter-spacing:.03em; color:var(--muted); text-transform:uppercase}
.state svg{width:13px; height:13px}
.card[data-explored="1"] .state{color:var(--primary)}
.card[data-explored="1"]{border-color:color-mix(in srgb, var(--primary) 30%, var(--border))}
.card h3{font-size:16px; margin:0 0 6px; letter-spacing:-.012em}
.card p{font-size:13.5px; color:var(--text2); margin:0; line-height:1.55}
.card-cta{margin-top:var(--sp-4); font-size:12.5px; font-weight:600; color:var(--primary); display:inline-flex; align-items:center; gap:5px}
.card-cta svg{width:13px; height:13px; transition:transform var(--t-fast) var(--ease)}
.card:hover .card-cta svg{transform:translateX(3px)}

/* ============================================================
   Extra moves (flip cards)
   ============================================================ */
.flipgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:var(--sp-4)}
.flip{display:block; perspective:1400px; background:none; border:0; padding:0; cursor:pointer; min-height:218px; text-align:left}
.flip-in{
  display:block; position:relative; width:100%; height:100%; min-height:218px;
  transform-style:preserve-3d; transition:transform var(--t-slow) var(--ease);
}
.flip[aria-expanded="true"] .flip-in{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border:1px solid var(--border); border-radius:var(--r-lg); padding:var(--sp-4);
  background:var(--surface); backdrop-filter:blur(10px); box-shadow:var(--shadow-soft);
  display:flex; flex-direction:column; gap:var(--sp-2); overflow:hidden;
}
.face.back{transform:rotateY(180deg); background:var(--surface2); border-color:color-mix(in srgb, var(--primary) 30%, var(--border))}
.flip:hover .face{border-color:var(--border2)}
.face h4{font-size:14.5px; margin:0}
.face p{font-size:13px; color:var(--text2); margin:0; line-height:1.5}
.face .pill{
  align-self:flex-start; font-size:10.5px; font-weight:650; letter-spacing:.07em; text-transform:uppercase;
  color:var(--primary); background:var(--primary-soft); padding:4px 9px; border-radius:999px;
  border:1px solid color-mix(in srgb, var(--primary) 24%, transparent);
}
.face .when{margin-top:auto; font-size:12px; color:var(--muted); border-top:1px dashed var(--border); padding-top:var(--sp-2)}
.face .when b{color:var(--text2); font-weight:600}
.flip-hint{margin-top:auto; font-size:11.5px; color:var(--muted); display:inline-flex; align-items:center; gap:5px}
.flip-hint svg{width:12px; height:12px}

/* ============================================================
   Modal / learning stage
   ============================================================ */
.overlay{
  position:fixed; inset:0; z-index:60; display:grid; place-items:start center;
  padding:var(--sp-5); overflow-y:auto;
  background:color-mix(in srgb, var(--bg) 72%, rgba(0,0,0,.5));
  backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
  animation:fade var(--t-med) var(--ease);
}
.overlay[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:min(1120px,100%); margin:auto 0;
  background:linear-gradient(180deg, var(--bg2), var(--bg));
  border:1px solid var(--border2); border-radius:var(--r-xl);
  box-shadow:var(--shadow); overflow:hidden;
  animation:rise var(--t-slow) var(--ease);
}
@keyframes rise{from{opacity:0; transform:translateY(14px) scale(.985)}to{opacity:1; transform:none}}
.modal-head{
  display:flex; align-items:flex-start; gap:var(--sp-4);
  padding:var(--sp-5) var(--sp-5) var(--sp-4);
  border-bottom:1px solid var(--border);
  background:var(--surface);
}
.modal-head .num{width:34px; height:34px; font-size:13px; flex:0 0 34px}
.modal-head h2{font-size:clamp(18px,2.4vw,24px); margin:0 0 4px}
.modal-head p{margin:0; font-size:14px; color:var(--text2); max-width:72ch}
.modal-close{margin-left:auto; flex:0 0 auto}
.modal-body{padding:var(--sp-5)}
.block{margin-bottom:var(--sp-5)}
.block-label{
  font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); margin-bottom:var(--sp-2); display:flex; align-items:center; gap:8px;
}
.block-label::after{content:""; flex:1; height:1px; background:var(--border)}
.scenario{
  background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--primary);
  border-radius:var(--r-md); padding:var(--sp-4);
}
.scenario h4{font-size:14.5px; margin:0 0 6px}
.scenario p{font-size:14px; color:var(--text2); margin:0 0 var(--sp-2)}
.scenario p:last-child{margin-bottom:0}
.facts{list-style:none; margin:var(--sp-3) 0 0; padding:0; display:grid; gap:6px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.facts li{font-size:13px; color:var(--text2); background:var(--bg3); border:1px solid var(--border); border-radius:var(--r-sm); padding:8px 11px}
.facts li b{color:var(--text); font-weight:600}
.dtable{width:100%; border-collapse:collapse; margin-top:var(--sp-3); font-size:13px; background:var(--bg3); border-radius:var(--r-sm); overflow:hidden}
.dtable caption{caption-side:top; text-align:left; font-size:12px; color:var(--muted); padding-bottom:6px}
.dtable th,.dtable td{padding:7px 11px; text-align:left; border-bottom:1px solid var(--border)}
.dtable th{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:650; background:var(--surface)}
.dtable tr:last-child td{border-bottom:0}
.dtable td.n{text-align:right; font-family:var(--ff-mono); font-size:12.5px}

/* --- stage controls --- */
.stage-bar{display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap; margin-bottom:var(--sp-4)}
.btn{
  height:40px; display:inline-flex; align-items:center; gap:8px; padding:0 16px;
  border-radius:var(--r-sm); border:1px solid var(--border); background:var(--surface);
  color:var(--text); font-size:14px; font-weight:600; cursor:pointer;
  transition:background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease), opacity var(--t-fast) var(--ease);
}
.btn svg{width:16px; height:16px; flex:0 0 16px}
.btn:hover{background:var(--surface2); border-color:var(--border2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none}
.btn-primary{background:linear-gradient(145deg,var(--primary),var(--accent)); color:var(--primary-ink); border-color:transparent; box-shadow:0 10px 26px -14px var(--glow)}
.btn-primary:hover{background:linear-gradient(145deg,var(--accent),var(--primary)); border-color:transparent}
.btn-ghost{background:transparent}
.stage-bar .spacer{flex:1}
.stage-hint{font-size:12.5px; color:var(--muted)}

/* --- comparison panels --- */
.panels{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-4); align-items:start}
.panel{
  border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden;
  background:var(--surface); box-shadow:var(--shadow-soft); display:flex; flex-direction:column;
}
.panel.after{border-color:color-mix(in srgb, var(--primary) 34%, var(--border))}
.panel-head{
  display:flex; align-items:center; gap:8px; padding:11px var(--sp-4);
  border-bottom:1px solid var(--border); background:var(--bg3);
  font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
}
.panel.after .panel-head{color:var(--primary)}
.panel-head .dot{width:8px; height:8px; border-radius:50%; background:var(--muted)}
.panel.after .panel-head .dot{background:var(--primary)}
.panel-head .tag{margin-left:auto; font-size:10.5px; letter-spacing:.04em; text-transform:none; font-weight:600; color:var(--muted)}
.chat{padding:var(--sp-4); display:flex; flex-direction:column; gap:var(--sp-3); min-height:120px}
.msg{display:flex; gap:10px; max-width:100%}
.msg .who{
  flex:0 0 28px; width:28px; height:28px; border-radius:8px; display:grid; place-items:center;
  font-size:10.5px; font-weight:700; letter-spacing:.02em; border:1px solid var(--border);
  background:var(--bg3); color:var(--muted);
}
.msg.ai .who{background:var(--primary-soft); color:var(--primary); border-color:color-mix(in srgb, var(--primary) 26%, transparent)}
.bubble{
  flex:1 1 auto; min-width:0; border:1px solid var(--border); border-radius:var(--r-md);
  padding:11px var(--sp-3); font-size:13.5px; line-height:1.6; background:var(--bubble-user);
}
.msg.ai .bubble{background:var(--bubble-ai)}
.msg.user .bubble{font-family:var(--ff-mono); font-size:12.8px; line-height:1.62; white-space:pre-wrap}
.bubble p{margin:0 0 8px}
.bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{margin:0 0 8px; padding-left:18px}
.bubble li{margin-bottom:4px}
.bubble li:last-child{margin-bottom:0}
.bubble h5{margin:0 0 6px; font-size:13px; letter-spacing:-.005em}
.bubble .meta{font-size:11.5px; color:var(--muted); margin-top:8px; padding-top:7px; border-top:1px dashed var(--border)}
.bubble .flat{display:grid; gap:5px; margin:0 0 8px}
.bubble .flat div{display:flex; justify-content:space-between; gap:10px; font-size:12.8px; background:var(--bg3); border:1px solid var(--border); border-radius:7px; padding:5px 9px}
.bubble .flat b{font-family:var(--ff-mono); font-weight:600}
.cursor{display:inline-block; width:7px; height:1.05em; vertical-align:-.16em; background:var(--primary); margin-left:1px; animation:blink .95s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.msg.pending{opacity:.55}
.thinking{display:inline-flex; gap:4px; align-items:center; padding:2px 0}
.thinking i{width:6px; height:6px; border-radius:50%; background:var(--muted); animation:bounce 1.1s infinite}
.thinking i:nth-child(2){animation-delay:.14s}
.thinking i:nth-child(3){animation-delay:.28s}
@keyframes bounce{0%,80%,100%{transform:translateY(0); opacity:.4}40%{transform:translateY(-4px); opacity:1}}

/* --- highlight linking --- */
mark.hl{
  background:var(--mark-a); color:inherit; border-radius:5px; padding:1px 3px;
  box-shadow:inset 0 -1.5px 0 var(--mark-a-line);
  cursor:help; transition:background var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
mark.hl[data-k="b"]{background:var(--mark-b); box-shadow:inset 0 -1.5px 0 var(--mark-b-line)}
mark.hl[data-k="c"]{background:var(--mark-c); box-shadow:inset 0 -1.5px 0 var(--mark-c-line)}
mark.hl[data-k="d"]{background:var(--mark-d); box-shadow:inset 0 -1.5px 0 var(--mark-d-line)}
mark.hl:focus-visible{outline:2px solid var(--primary); outline-offset:2px}
.echo{border-radius:5px; padding:1px 2px; transition:background var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease)}
.lit{background:var(--mark-a)!important; box-shadow:inset 0 -1.5px 0 var(--mark-a-line)}
.lit[data-k="b"]{background:var(--mark-b)!important; box-shadow:inset 0 -1.5px 0 var(--mark-b-line)}
.lit[data-k="c"]{background:var(--mark-c)!important; box-shadow:inset 0 -1.5px 0 var(--mark-c-line)}
.lit[data-k="d"]{background:var(--mark-d)!important; box-shadow:inset 0 -1.5px 0 var(--mark-d-line)}
.dimmed{opacity:.42; transition:opacity var(--t-fast) var(--ease)}
.link-legend{margin-top:var(--sp-3); font-size:12px; color:var(--muted); display:flex; align-items:center; gap:7px}
.link-legend svg{width:14px; height:14px; flex:0 0 14px}

/* --- mini chart --- */
.mini{margin:0 0 8px; display:grid; gap:7px}
.mini .row{display:grid; grid-template-columns:78px 1fr 58px; align-items:center; gap:9px; font-size:12.5px}
.mini .lab{color:var(--text2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mini .track{height:9px; border-radius:999px; background:var(--bg3); border:1px solid var(--border); overflow:hidden}
.mini .fill{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--primary),var(--accent)); width:0; transition:width var(--t-slow) var(--ease)}
.mini .fill.neg{background:linear-gradient(90deg,var(--danger),color-mix(in srgb,var(--danger) 55%, var(--highlight)))}
.mini .val{text-align:right; font-family:var(--ff-mono); font-size:12px; color:var(--text)}

/* --- below the panels --- */
.after-grid{display:grid; grid-template-columns:1.15fr .85fr; gap:var(--sp-4); margin-top:var(--sp-5)}
.box{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--sp-4)}
.checklist{list-style:none; margin:0; padding:0; display:grid; gap:9px}
.checklist li{display:flex; gap:9px; font-size:13.5px; color:var(--text2); align-items:flex-start}
.checklist svg{width:16px; height:16px; flex:0 0 16px; margin-top:2px; color:var(--primary)}
.takeaway{
  background:linear-gradient(135deg, var(--primary-soft), transparent 70%);
  border:1px solid color-mix(in srgb, var(--primary) 28%, var(--border));
  border-radius:var(--r-md); padding:var(--sp-4);
}
.takeaway p{margin:0; font-size:14.5px; font-weight:550; line-height:1.5}
.tip{display:flex; gap:10px; margin-top:var(--sp-3); font-size:13px; color:var(--text2); background:var(--bg3); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--sp-3)}
.tip svg{width:16px; height:16px; flex:0 0 16px; color:var(--highlight); margin-top:2px}
.tip b{color:var(--text)}
.tryit{margin-top:var(--sp-5)}
.tpl-wrap{position:relative; background:var(--bg3); border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden}
.tpl{
  margin:0; padding:var(--sp-4); padding-right:118px; overflow-x:auto;
  font-family:var(--ff-mono); font-size:12.8px; line-height:1.7; color:var(--text2); white-space:pre-wrap;
}
.tpl .ph{color:var(--primary); background:var(--primary-soft); border-radius:4px; padding:0 3px; font-weight:600}
.copy{position:absolute; top:10px; right:10px; height:34px; font-size:13px; padding:0 13px}
.copy.ok{background:var(--primary-soft); border-color:color-mix(in srgb, var(--primary) 34%, transparent); color:var(--primary)}
.modal-foot{
  display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap;
  padding:var(--sp-4) var(--sp-5); border-top:1px solid var(--border); background:var(--surface);
}
.modal-foot .spacer{flex:1}
.stepdots{display:flex; gap:6px}
.stepdots button{width:9px; height:9px; padding:0; border-radius:50%; border:1px solid var(--border2); background:transparent; cursor:pointer}
.stepdots button[aria-current="true"]{background:var(--primary); border-color:var(--primary)}

/* ============================================================
   Footer
   ============================================================ */
.site-foot{margin-top:var(--sp-7); border-top:1px solid var(--border); background:var(--surface); padding:var(--sp-5) 0 var(--sp-6)}
.foot-in{display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:var(--sp-5); max-width:var(--maxw); margin:0 auto; padding:0 var(--sp-5)}
.site-foot h4{font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin:0 0 var(--sp-2)}
.site-foot p,.site-foot li{font-size:12.5px; color:var(--text2); line-height:1.6; margin:0 0 6px}
.site-foot ul{list-style:none; margin:0; padding:0}
.disclaimer{margin-top:var(--sp-4); padding-top:var(--sp-4); border-top:1px dashed var(--border); max-width:var(--maxw); margin-left:auto; margin-right:auto; padding-left:var(--sp-5); padding-right:var(--sp-5)}
.disclaimer p{font-size:12px; color:var(--muted); margin:0}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width:1100px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .flipgrid{grid-template-columns:repeat(2,1fr)}
  .after-grid{grid-template-columns:1fr}
}
@media (max-width:900px){
  .panels{grid-template-columns:1fr}
  .foot-in{grid-template-columns:1fr 1fr}
  .modal-body{padding:var(--sp-4)}
  .modal-head{padding:var(--sp-4)}
}
@media (max-width:760px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .wrap{padding:0 var(--sp-4)}
  .topbar-in{padding:var(--sp-2) var(--sp-4); gap:var(--sp-2)}
  .brandtxt span{display:none}
  .hero{padding:var(--sp-6) 0 var(--sp-4)}
  .overlay{padding:0}
  .modal{border-radius:0; min-height:100%; border-left:0; border-right:0}
}
@media (max-width:520px){
  .grid{grid-template-columns:1fr}
  .flipgrid{grid-template-columns:1fr}
  .foot-in{grid-template-columns:1fr}
  .tpl{padding-right:var(--sp-4); padding-top:52px}
  .copy{top:10px; right:10px}
  .modal-foot{padding:var(--sp-3) var(--sp-4)}
  .btn{height:38px; padding:0 13px; font-size:13.5px}
}

/* ============================================================
   Reduced motion
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important; scroll-behavior:auto!important}
  .flip-in{transition:none}
  .cursor{animation:none}
}

/* ============================================================
   Print report
   ============================================================ */
.print-only{display:none}
@media print{
  @page{margin:14mm}
  html[data-palette][data-mode]{--bg:#fff; --bg2:#fff; --bg3:#F4F4F4; --surface:#fff; --surface2:#fff; --surface-solid:#fff;
        --border:#CFCFCF; --border2:#AAA; --text:#111; --text2:#333; --muted:#666;
        --primary:#1F1F1F; --primary-ink:#fff; --primary-soft:#EFEFEF; --accent:#1F1F1F;
        --highlight:#8A5A00; --supporting:#1C3FAF; --shadow:none; --shadow-soft:none;
        --mark-a:#E6F3EE; --mark-b:#E8EDFB; --mark-c:#FBF2E0; --mark-d:#F0EAFB;
        --bubble-user:#F7F7F7; --bubble-ai:#F2F8F5;}
  body{background:#fff!important; color:#111!important; font-size:10.5pt}
  body::before,#bgCanvas,.topbar,.overlay,.stage-bar,.flip-hint,.skip{display:none!important}
  .hero,.grid,.flipgrid,.extras,.section-head,.site-foot,main>section{display:none!important}
  main{padding:0!important; max-width:none!important}
  .print-only{display:block!important}
  .p-tech{page-break-inside:avoid; break-inside:avoid; border:1px solid #CFCFCF; border-radius:6px; padding:5mm; margin-bottom:6mm}
  .p-tech h3{font-size:13pt; margin:0 0 2mm}
  .p-tech .p-sub{font-size:9pt; color:#555; margin:0 0 3mm}
  .p-cols{display:grid; grid-template-columns:1fr 1fr; gap:4mm}
  .p-box{border:1px solid #DDD; border-radius:5px; padding:3mm; background:#FAFAFA}
  .p-box h5{margin:0 0 2mm; font-size:8.5pt; text-transform:uppercase; letter-spacing:.06em; color:#555}
  .p-box pre{margin:0 0 2mm; white-space:pre-wrap; font-family:var(--ff-mono); font-size:8.5pt; color:#222}
  .p-box .p-ans{font-size:9pt; color:#222}
  .p-box .p-ans ul{padding-left:4mm; margin:0 0 2mm}
  .p-take{margin-top:3mm; font-size:9.5pt; border-left:3px solid #1F1F1F; padding-left:3mm}
  .p-head h1{font-size:19pt; margin:0 0 3mm}
  .p-head p{font-size:10pt; color:#444}
  .print-only .facts{display:grid; grid-template-columns:repeat(3,1fr); gap:2mm; list-style:none; padding:0}
  .print-only .facts li{background:#F4F4F4; border:1px solid #DDD; border-radius:4px; padding:2mm; font-size:8.5pt}
  .print-only .flat{display:grid; gap:1mm; margin:0 0 2mm}
  .print-only .flat div{display:flex; justify-content:space-between; gap:4mm; background:#F4F4F4; border:1px solid #E2E2E2; border-radius:3px; padding:1mm 2mm; font-size:8.5pt}
  .print-only .meta{color:#666; font-size:8pt; border-top:1px dotted #DDD; padding-top:1mm; margin-top:1mm}
  .print-only .p-ans h5{font-size:9pt; margin:2mm 0 1mm; color:#111; text-transform:none; letter-spacing:0}
  .print-only .mini .fill{background:#555!important}
  .print-only .mini .fill.neg{background:#999!important}
  .p-tpl{margin-top:2mm; font-family:var(--ff-mono); font-size:8.5pt; white-space:pre-wrap; color:#333}
  mark.hl{background:#EFEFEF!important; box-shadow:none!important; color:#111!important}
  .p-head{margin-bottom:8mm}
  .p-foot{margin-top:6mm; border-top:1px solid #CFCFCF; padding-top:3mm; font-size:8.5pt; color:#555}
  a{color:#111; text-decoration:none}
}

  function sleep(ms, tok) {

  function typeIn(bubble, tok, cps) {
    return new Promise(function (resolve) {
      var nodes = [], w = document.createTreeWalker(bubble, NodeFilter.SHOW_TEXT, null, false), n;
      while ((n = w.nextNode())) { if (n.nodeValue.length) nodes.push({ node: n, full: n.nodeValue }); }
      if (!nodes.length) { fillCharts(bubble); resolve(true); return; }
      nodes.forEach(function (o) { o.node.nodeValue = ""; });
      var cursor = document.createElement("span");
      cursor.className = "cursor";
      cursor.setAttribute("aria-hidden", "true");
      bubble.appendChild(cursor);
      var idx = 0, pos = 0, last = null, carry = 0;
      function frame(ts) {
        if (tok !== runToken) { if (cursor.parentNode) cursor.parentNode.removeChild(cursor); resolve(false); return; }
        if (last === null) last = ts;
        var dt = Math.min(90, ts - last); last = ts;
        carry += (cps * dt) / 1000;
        var budget = Math.max(1, Math.floor(carry));
        carry -= budget;
        while (budget > 0 && idx < nodes.length) {
          var o = nodes[idx], left = o.full.length - pos;
          var take = Math.min(budget, left);
          pos += take; budget -= take;
          o.node.nodeValue = o.full.slice(0, pos);
          if (pos >= o.full.length) { idx++; pos = 0; }
        }
        if (idx >= nodes.length) {
          if (cursor.parentNode) cursor.parentNode.removeChild(cursor);
          fillCharts(bubble);
          resolve(true);
          return;
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    });
  }

  function runSim() {
    var tok = ++runToken, seq = steps(cur), instant = reduced();
    var a = $("#chatBefore"), b = $("#chatAfter");
    a.innerHTML = ""; b.innerHTML = "";
    linkReady = false;
    $("#mPanels").classList.remove("linking");
    setPlaying(true);

    (function next(k) {
      if (tok !== runToken) return;
      if (k >= seq.length) {
        finish();
        return;
      }
      var st = seq[k], host = $(st.panel);
      if (!host) return;
      var m = msgEl(st.role), bubble = m.querySelector(".bubble");
      host.appendChild(m);
      if (st.role === "ai" && !instant) {
        m.classList.add("pending");
        bubble.innerHTML = '<span class="thinking" aria-label="' + esc(dict().ui.thinking) + '"><i></i><i></i><i></i></span>';
        sleep(460, tok).then(function (ok) {
          if (!ok) return;
          m.classList.remove("pending");
          bubble.innerHTML = st.html;
          typeIn(bubble, tok, st.cps).then(function (done) {
            if (!done) return;
            sleep(instant ? 0 : 260, tok).then(function (ok2) { if (ok2) next(k + 1); });
          });
        });
        return;
      }
      bubble.innerHTML = st.html;
      if (instant) {
        fillCharts(bubble);
        next(k + 1);
        return;
      }
      typeIn(bubble, tok, st.cps).then(function (done) {
        if (!done) return;
        sleep(300, tok).then(function (ok) { if (ok) next(k + 1); });
      });
    })(0);

    function finish() {
      if (tok !== runToken) return;
      setPlaying(false);
      var r = $("#mReplay"); if (r) r.disabled = false;

      announce(dict().ui.simDone);

  /* ============================================================
     Background: connected-node particles
     ============================================================ */
  function particles() {
    var cv = $("#bgCanvas"), ctx = cv.getContext("2d");
    var w = 0, h = 0, dpr = 1, pts = [], raf = null, nodeCol = "rgba(255,255,255,.4)", linkCol = "rgba(255,255,255,.1)";

    function colors() {
      var cs = getComputedStyle(document.documentElement);
      nodeCol = (cs.getPropertyValue("--node") || nodeCol).trim();
      linkCol = (cs.getPropertyValue("--link") || linkCol).trim();
    }
    function size() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      w = cv.clientWidth; h = cv.clientHeight;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var target = Math.max(16, Math.min(58, Math.round((w * h) / 26000)));
      pts = [];
      for (var i = 0; i < target; i++) {
        pts.push({
          x: Math.random() * w, y: Math.random() * h,
          vx: (Math.random() - .5) * .16, vy: (Math.random() - .5) * .16,
          r: 1 + Math.random() * 1.6
        });
      }
    }
    function draw(move) {
      ctx.clearRect(0, 0, w, h);
      var i, j, p, q, dx, dy, dist, max = 148;
      for (i = 0; i < pts.length; i++) {
        p = pts[i];
        if (move) {
          p.x += p.vx; p.y += p.vy;
          if (p.x < -20) p.x = w + 20; if (p.x > w + 20) p.x = -20;
          if (p.y < -20) p.y = h + 20; if (p.y > h + 20) p.y = -20;
        }
      }
      ctx.strokeStyle = linkCol; ctx.lineWidth = 1;
      for (i = 0; i < pts.length; i++) {
        p = pts[i];
        for (j = i + 1; j < pts.length; j++) {
          q = pts[j]; dx = p.x - q.x; dy = p.y - q.y;
          dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < max) {
            ctx.globalAlpha = 1 - dist / max;
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
          }
        }
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = nodeCol;
      for (i = 0; i < pts.length; i++) {
        p = pts[i];
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
    }
    function loop() { draw(true); raf = requestAnimationFrame(loop); }
    function start() {
      stop();
      if (reduced()) { draw(false); return; }
      raf = requestAnimationFrame(loop);
    }
    function stop() { if (raf) { cancelAnimationFrame(raf); raf = null; } }

    colors(); size(); start();

    var rt = null;
    window.addEventListener("resize", function () {
      clearTimeout(rt);
      rt = setTimeout(function () { size(); start(); }, 180);
    });
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) stop(); else start();
    });
    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
      if (mq.addEventListener) mq.addEventListener("change", start);
    }
    return { recolor: function () { colors(); if (reduced()) draw(false); }, pause: stop, resume: start };
  }

  /* ============================================================
     Wiring
     ============================================================ */
  var bg = null;

  function renderAll() {
    renderChrome();
    renderCards();
    renderExtras();
    renderProgress();
    renderPrint();
    if (bg) bg.recolor();
  }

  function init() {
    load();
    if (!localStorage.getItem(KEY)) { S.lang = detectLang(); }
    renderAll();
    bg = particles();

    /* cards */
    $("#cardGrid").addEventListener("click", function (e) {
      var c = e.target.closest(".card");
      if (c) openModal(parseInt(c.dataset.i, 10), c);
    });

    /* flip cards */
    $("#flipGrid").addEventListener("click", function (e) {
      var f = e.target.closest(".flip");
      if (!f) return;
      var on = f.getAttribute("aria-expanded") === "true";
      f.setAttribute("aria-expanded", on ? "false" : "true");
    });

    /* controls */
    $("#langSel").addEventListener("change", function (e) {
      S.lang = e.target.value; save();
      var wasOpen = cur;
      renderAll();
      if (wasOpen > -1) { openModal(wasOpen, opener); }
      announce(L[S.lang].label);
    });
    $("#paletteSel").addEventListener("change", function (e) {
      S.palette = e.target.value; save();
      document.documentElement.dataset.palette = S.palette;
      if (bg) bg.recolor();
    });
    $("#modeBtn").addEventListener("click", function () {
      S.mode = S.mode === "dark" ? "light" : "dark"; save();
      document.documentElement.dataset.mode = S.mode;
      var d = dict(), lbl = S.mode === "dark" ? d.ui.modeToLight : d.ui.modeToDark;
      $("#modeBtn").setAttribute("aria-label", lbl); $("#modeBtn").title = lbl;
      $("#modeIcon").innerHTML = '<path d="' + (S.mode === "dark" ? I.sun : I.moon) + '"/>';
      if (bg) bg.recolor();
    });
    $("#printBtn").addEventListener("click", function () {
      renderPrint();
      /* some embedded contexts refuse window.print(); fall back to a hint */
      try { window.print(); } catch (e) { announce(dict().ui.printFallback); }
    });

    /* Reset asks for a second click rather than a modal dialog, which some
       embedded contexts refuse outright. */
    var resetArmed = null;
    $("#resetBtn").addEventListener("click", function () {
      var b = $("#resetBtn"), d = dict();
      if (!resetArmed) {
        b.classList.remove("icon-only");
        b.insertAdjacentHTML("beforeend", '<span id="resetAsk">' + esc(d.ui.resetAsk) + "</span>");
        b.setAttribute("aria-label", d.ui.resetConfirm);
        b.title = d.ui.resetConfirm;
        announce(d.ui.resetConfirm);
        resetArmed = setTimeout(disarm, 4000);
        return;
      }
      disarm();
      S.explored = []; save();
      renderCards(); renderProgress();
      announce(d.ui.resetDone);
    });
    function disarm() {
      clearTimeout(resetArmed);
      resetArmed = null;
      var b = $("#resetBtn"), a = $("#resetAsk"), d = dict();
      if (a) a.remove();
      if (b) {
        b.classList.add("icon-only");
        b.setAttribute("aria-label", d.ui.resetLabel);
        b.title = d.ui.resetLabel;
      }
    }

    /* modal delegation */
    var ov = $("#overlay");
    ov.addEventListener("click", function (e) {
      if (e.target === ov) { closeModal(); return; }
      var jump = e.target.closest("[data-jump]");
      if (jump) { openModal(parseInt(jump.dataset.jump, 10), opener); return; }
      if (e.target.closest("#mClose")) { closeModal(); return; }
      if (e.target.closest("#mPlay")) { runSim(); return; }
      if (e.target.closest("#mReplay")) { resetStage(); runSim(); return; }
      if (e.target.closest("#mPrev")) { if (cur > 0) openModal(cur - 1, opener); return; }
      if (e.target.closest("#mNext")) { if (cur < TOTAL - 1) openModal(cur + 1, opener); return; }
      if (e.target.closest("#mCopy")) { copyTpl(); return; }
    });

    /* highlight linking (delegated; active only once the simulation has finished) */
    ov.addEventListener("mouseover", function (e) {
      if (!linkReady) return;
      var m = e.target.closest("mark.hl");
      if (m && m.closest(".panel.after")) litFor(m.getAttribute("data-k"));
    });
    ov.addEventListener("mouseout", function (e) {
      if (!linkReady) return;
      var m = e.target.closest("mark.hl");
      if (m && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("mark.hl"))) clearLit();
    });
    ov.addEventListener("focusin", function (e) {
      if (!linkReady) return;
      var m = e.target.closest ? e.target.closest("mark.hl") : null;
      if (m && m.closest(".panel.after")) litFor(m.getAttribute("data-k"));
      else clearLit();
    });

    /* keyboard */
    document.addEventListener("keydown", function (e) {
      if ($("#overlay").hidden) return;
      if (e.key === "Escape") { e.preventDefault(); closeModal(); return; }
      if (e.key === "Tab") {
        var f = focusables();
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        return;
      }
      if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
      if (e.key === "ArrowRight" && cur < TOTAL - 1) { e.preventDefault(); openModal(cur + 1, opener); }
      if (e.key === "ArrowLeft" && cur > 0) { e.preventDefault(); openModal(cur - 1, opener); }
    });

    window.addEventListener("beforeprint", renderPrint);
  }

  if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", init); }
  else { init(); }
})();
</script>
</body>
